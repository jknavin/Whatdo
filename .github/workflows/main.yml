name: Build Whatdo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web, extension and Android assets
        run: python3 build.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: App icon
        working-directory: android-app
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; size=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon.png -resize ${size}x${size} $RES/mipmap-$name/$f.png
            done
          done

      - name: Use stable signing key
        run: |
          mkdir -p ~/.android
          cp android-app/whatdo.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Whatdo-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Whatdo-website
          path: web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: Whatdo-extension
          path: extension/
